<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enable</title>
</head>

<body>
    <div class="container" style="position: relative;">
        <div style="width: 100%; background: rgb(6, 6, 78); height: 300px; color: white ;padding-top: 20px;">
            <h1 style="text-align: center;">Silvestre's Exquisite Events & Style </h1>
        </div>
        <div
            style="border-radius: 8px;background-color: white; width: 50%; left:25%; padding:10px; position:absolute; top:150px; padding-left: 20px;">
            <img src="">
            <p>Hi <span th:text="${name}">User</span>,</p>
            <p>Thank you for signing up! Please verify your email address by clicking the button below.</p>
            <div style="margin:30px 0px;">
                <a th:href="${verificationLink}" style="
                    background-color: blue;
                    color: #ffffff;
                    padding: 12px 16px;
                    text-decoration: none;
                    opacity: .8;
                    border-radius: 5px;
                    display: inline-block;
                    cursor: pointer;
                  ">Confirm your email</a>
            </div>

            <p>If you did not request this, you can safely ignore this email.</p>
            <h4>Cheers,</h4>
            <p>Silvestre Team</p>
            <div style=" background-color: rgb(6, 6, 78); border-bottom-left-radius: 8px; border-bottom-right-radius:
            8px; padding: 2px; color: white; text-align: center; opacity: .9;">
                <p>Silvestre</p>
            </div>
        </div>
    </div>
</body>

</html>
